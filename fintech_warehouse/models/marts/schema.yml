version: 2

models:
  - name: fct_daily_transactions
    description: "Daily transaction performance metrics."

    columns:
      - name: date_key
        description: "Date represented by the daily aggregate."
        tests:
          - not_null
          - unique

      - name: total_transactions
        description: "Total number of transactions."
        tests:
          - not_null

      - name: successful_transactions
        description: "Number of successful transactions."
        tests:
          - not_null

      - name: failed_transactions
        description: "Number of failed transactions."
        tests:
          - not_null

      - name: pending_transactions
        description: "Number of pending transactions."
        tests:
          - not_null

      - name: total_amount
        description: "Total transaction value."
        tests:
          - not_null

      - name: successful_amount
        description: "Total value of successful transactions."
        tests:
          - not_null

      - name: failed_amount
        description: "Total value of failed transactions."
        tests:
          - not_null

      - name: pending_amount
        description: "Total value of pending transactions."
        tests:
          - not_null

      - name: success_rate
        description: "Percentage of successful transactions."
        tests:
          - not_null

  - name: fct_payment_method

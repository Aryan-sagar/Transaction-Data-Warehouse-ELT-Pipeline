        tests:
          - not_null

      - name: failed_amount
        description: "Total value of failed transactions."
        tests:
          - not_null

      - name: pending_amount
        description: "Total value of pending transactions."
        tests:
          - not_null

      - name: success_rate
        description: "Percentage of successful transactions."
        tests:
          - not_null


